[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "1.0.0"
description = "CLI-помічник для керування контактами та нотатками"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
assistant = "personal_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["personal_assistant*"]
